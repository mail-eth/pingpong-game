<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ping Pong - Ilham's Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', cursive;
    }
    
    h1 {
      color: #fff;
      font-size: 0.7rem;
      margin-bottom: 3px;
      text-shadow: 0 0 10px #00ff88;
    }
    
    #score {
      color: #fff;
      font-size: 0.6rem;
      margin: 3px 0;
      display: flex;
      gap: 15px;
    }
    
    #score span {
      padding: 3px 6px;
      border-radius: 3px;
    }
    
    #playerScore { background: #00ff88; color: #000; }
    #aiScore { background: #ff00ff; color: #fff; }
    
    #mode {
      display: flex;
      gap: 8px;
      margin-bottom: 5px;
    }
    
    .mode-btn {
      background: #1a1a1a;
      border: 2px solid #444;
      color: #888;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.5rem;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mode-btn:hover {
      transform: scale(1.05);
    }
    
    .mode-btn.active {
      background: #00ff88;
      color: #000;
      border-color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
    }
    
    .mode-btn.hard.active {
      background: #ff6600;
      border-color: #ff6600;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
    }
    
    .mode-btn.hardcore.active {
      background: #ff0044;
      border-color: #ff0044;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.5);
    }
    
    #gameCanvas {
      border: 2px solid #00ff88;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
      background: #050505;
    }
    
    #controls {
      color: #555;
      font-size: 0.35rem;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <h1>🏓 PING PONG 🏓</h1>
  <div id="mode">
    <button class="mode-btn active" data-mode="normal">NORMAL</button>
    <button class="mode-btn hard" data-mode="hard">HARD</button>
    <button class="mode-btn hardcore" data-mode="hardcore">HARDCORE</button>
  </div>
  <div id="score">
    <span>YOU: <span id="player">0</span></span>
    <span>AI: <span id="ai">0</span></span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">TAP to START | DRAG to move</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Speed settings per mode
    const SPEED = {
      normal: { ball: 2, ai: 0.06, max: 3.5 },
      hard: { ball: 3.5, ai: 0.10, max: 5 },
      hardcore: { ball: 5, ai: 0.14, max: 7 }
    };
    
    let currentMode = 'normal';
    let settings = SPEED.normal;
    
    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        settings = SPEED[currentMode];
        // Reset game
        gameRunning = false;
        playerScore = 0;
        aiScore = 0;
        document.getElementById('player').textContent = 0;
        document.getElementById('ai').textContent = 0;
        resetBall();
        draw();
      });
    });
    
    // Full screen
    function setFullScreen() {
      const padding = 15;
      const availableWidth = window.innerWidth - padding;
      const availableHeight = window.innerHeight - 100;
      canvas.width = Math.min(availableWidth, availableHeight * 0.55);
      canvas.height = availableHeight;
    }
    
    setFullScreen();
    
    // Game constants
    const paddleWidth = Math.min(100, canvas.width * 0.35);
    const paddleHeight = 10;
    const ballSize = 10;
    const paddleGap = 3;
    
    // State
    let playerX = canvas.width / 2 - paddleWidth / 2;
    let aiX = canvas.width / 2 - paddleWidth / 2;
    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = settings.ball;
    let ballSpeedY = settings.ball;
    
    let playerScore = 0;
    let aiScore = 0;
    let gameRunning = false;
    
    function drawRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }
    
    function drawCircle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    
    function drawNet() {
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 8]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    function resetBall() {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * (settings.ball * 0.8);
      ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * settings.ball;
    }
    
    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }
    
    function update() {
      if (!gameRunning) return;
      
      ballX += ballSpeedX;
      ballY += ballSpeedY;
      
      // Wall collision
      if (ballX - ballSize/2 < 0) {
        ballX = ballSize/2;
        ballSpeedX = -ballSpeedX;
      }
      if (ballX + ballSize/2 > canvas.width) {
        ballX = canvas.width - ballSize/2;
        ballSpeedX = -ballSpeedX;
      }
      
      // Player paddle collision
      let playerPaddleY = canvas.height - paddleHeight - paddleGap;
      if (ballY + ballSize/2 > playerPaddleY && 
          ballY - ballSize/2 < playerPaddleY + paddleHeight &&
          ballX >= playerX && 
          ballX <= playerX + paddleWidth) {
        
        ballY = playerPaddleY - ballSize/2;
        ballSpeedY = -Math.abs(ballSpeedY);
        
        let hitPos = (ballX - (playerX + paddleWidth/2)) / (paddleWidth/2);
        ballSpeedX += hitPos * 1.2;
        ballSpeedX = clamp(ballSpeedX, -settings.max, settings.max);
      }
      
      // AI paddle collision
      let aiPaddleY = paddleGap;
      if (ballY - ballSize/2 < aiPaddleY + paddleHeight && 
          ballY + ballSize/2 > aiPaddleY &&
          ballX >= aiX && 
          ballX <= aiX + paddleWidth) {
        
        ballY = aiPaddleY + paddleHeight + ballSize/2;
        ballSpeedY = Math.abs(ballSpeedY);
        
        let hitPos = (ballX - (aiX + paddleWidth/2)) / (paddleWidth/2);
        ballSpeedX += hitPos * 1;
        ballSpeedX = clamp(ballSpeedX, -settings.max, settings.max);
      }
      
      // AI movement
      let aiTarget = ballX - paddleWidth/2;
      let aiDiff = aiTarget - aiX;
      aiX += aiDiff * settings.ai;
      aiX = clamp(aiX, 0, canvas.width - paddleWidth);
      
      // Score
      if (ballY > canvas.height) {
        aiScore++;
        document.getElementById('ai').textContent = aiScore;
        resetBall();
      }
      if (ballY < 0) {
        playerScore++;
        document.getElementById('player').textContent = playerScore;
        resetBall();
      }
    }
    
    function draw() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      drawNet();
      drawRect(playerX, canvas.height - paddleHeight - paddleGap, paddleWidth, paddleHeight, '#00ff88');
      drawRect(aiX, paddleGap, paddleWidth, paddleHeight, '#ff00ff');
      
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ffffff';
      drawCircle(ballX, ballY, ballSize/2, '#ffffff');
      ctx.shadowBlur = 0;
    }
    
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    function handleMove(clientX) {
      let rect = canvas.getBoundingClientRect();
      let scaleX = canvas.width / rect.width;
      let canvasX = (clientX - rect.left) * scaleX;
      playerX = clamp(canvasX - paddleWidth/2, 0, canvas.width - paddleWidth);
    }
    
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleMove(e.touches[0].clientX);
      if (!gameRunning) startGame();
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handleMove(e.touches[0].clientX);
    }, { passive: false });
    
    canvas.addEventListener('mousedown', (e) => {
      handleMove(e.clientX);
      if (!gameRunning) startGame();
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) handleMove(e.clientX);
    });
    
    function startGame() {
      gameRunning = true;
      playerScore = 0;
      aiScore = 0;
      document.getElementById('player').textContent = 0;
      document.getElementById('ai').textContent = 0;
      resetBall();
    }
    
    window.addEventListener('resize', setFullScreen);
    
    gameLoop();
  </script>
</body>
</html>
